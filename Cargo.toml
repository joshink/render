[package]
name = "render-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "22.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.1"
pollster = "0.3.0"
log = "0.4"
env_logger = "0.11"
bytemuck = { version = "1.16", features = ["derive"] }
libc = "0.2"
evalexpr = "11.3.0"
swash = "0.1.19"
rust-s3 = { version = "0.33", default-features = false, features = ["blocking", "sync-native-tls"] }
ureq = "2.9"
clap = { version = "4.4", features = ["derive"] }
kdl = "=6.5.0"


[dev-dependencies]
naga = { version = "22.1", features = ["wgsl-in"] }
